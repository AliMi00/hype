name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install render dependencies
        working-directory: skills/hype/scripts
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Doctor
        run: node skills/hype/scripts/doctor.mjs
      - name: Checks + render smoke test
        run: node scripts/check.mjs --render
